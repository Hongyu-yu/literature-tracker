name: Backfill missing posters (one-shot)

on:
  workflow_dispatch:
    inputs:
      max:
        description: "本次最多补几张海报(控成本)"
        required: false
        default: "60"
      glob:
        description: "待扫描 JSON 通配"
        required: false
        default: "data/arxiv_core_*.json"

permissions:
  contents: write

concurrency:
  group: "backfill-posters"
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure gateway hosts (fallback for gateway DNS resolution failure; mapping in secret)
        run: echo "${{ secrets.AI_HOSTS_ENTRY }}" | sudo tee -a /etc/hosts

      - name: Run poster backfill (image-only, reuse cached elements)
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_PROVIDER: aigw
          AI_MODEL: gpt-5.5
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          IMAGE_API_KEY: ${{ secrets.AI_API_KEY }}
          IMAGE_API_BASE: ${{ secrets.AI_BASE_URL }}
          IMAGE_TIMEOUT_SECONDS: "600"
          IMAGE_MAX_RETRIES: "2"
          POSTER_GLOB: ${{ inputs.glob }}
          POSTER_MAX: ${{ inputs.max }}
        # dispatch 输入经 env 传入，避免把用户输入拼进 shell 命令
        run: python backfill_posters.py --glob "$POSTER_GLOB" --max "$POSTER_MAX"

      - name: Commit and push (race-safe)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if git diff --staged --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "🖼️ Backfill missing posters"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; exit 1; }
            if git push origin main; then echo "pushed on attempt $i"; exit 0; fi
            sleep 5
          done
          echo "push failed after 5 attempts"; exit 1
