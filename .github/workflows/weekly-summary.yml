name: Generate Weekly Summary

on:
  schedule:
    # 每周日 01:00 UTC (北京时间周日 09:00)——错开 fetch.yml 的 00:00,避免并发推 main 撞车
    # 周一 01:00 UTC（北京周一 09:00）。必须配合 default_week_start 的语义：
    # 它取「上一个已完成的周(周一~周日)」，所以周日跑只会重出上上周那张已存在的页面，
    # 最新一周要等到下个周日才发（滞后 7 天）；周一跑则滞后 1 天。
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    # 网关慢时周报生成可能超过 90 分钟(已连续两次超时被取消),放宽到 240
    timeout-minutes: 240
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Configure gateway hosts (fallback for gateway DNS resolution failure; mapping in secret)
        run: echo "${{ secrets.AI_HOSTS_ENTRY }}" | sudo tee -a /etc/hosts

      - name: Generate weekly summary
        run: |
          python weekly_summary.py
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_BASE_URL: ${{ secrets.KIMI_BASE_URL }}
          OPENROUTER_BASE_URL: ${{ secrets.AI_BASE_URL }}
          # 同上一步：weekly 的 overview/trends/outlook 与逐篇分析同样是长 JSON，
          # OpenRouterProvider 默认 4096 装不下（weekly_summary.py:940 的注释已记过这个坑）
          AI_MAX_TOKENS: "16384"

      - name: Commit and push changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add -A
          if git diff --staged --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "🔬 自动生成周报 [skip ci]"
          # race-safe push: rebase onto moved origin/main and retry (parallel workflows push to main)
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; exit 1; }
            if git push origin main; then echo "pushed on attempt $i"; exit 0; fi
            sleep 5
          done
          echo "push failed after 5 attempts"; exit 1

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Pull latest changes
        run: git pull origin main

      - name: Prepare docs data (docs/data is a deploy-time copy of data/)
        run: |
          mkdir -p docs/data
          # 只复制站点真正会请求的文件。docs/*.js/*.html 全量 grep 只出现 data/index.json，
          # sw.js 里的 /data/ 只是运行时缓存规则、不是预缓存清单。
          # 此前 `cp -r data/*` 把整份 data/(123MB：ai_relevant 36M、history 21M、
          # deep_history 5.5M、zotero.bib 4.7M……)塞进 Pages artifact，拖慢每次部署，
          # 也在往 Pages 的 1GB 上限上顶。
          for f in index.json; do
            if [ -f "data/$f" ]; then
              cp "data/$f" "docs/data/$f"
            fi
          done

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
