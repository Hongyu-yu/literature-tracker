name: Backfill zh fields (one-shot)

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Backfill scope: all_missing / fallback_english_only / site_latest_and_fallback"
        required: false
        default: "site_latest_and_fallback"
      batch_size:
        description: "LLM batch size per request"
        required: false
        default: "8"
      max_passes:
        description: "Max passes over dataset (retry remaining missing)"
        required: false
        default: "8"
      full:
        description: "Full-translation mode: backfill abstract_zh_full (--full)"
        required: false
        type: boolean
        default: false
      full_max:
        description: "Max articles per run in full mode (newest first; 0 = unlimited)"
        required: false
        default: "800"

permissions:
  contents: write

concurrency:
  group: "backfill-zh"
  cancel-in-progress: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure gateway hosts (fallback for gateway DNS resolution failure; mapping in secret)
        run: echo "${{ secrets.AI_HOSTS_ENTRY }}" | sudo tee -a /etc/hosts

      - name: Run backfill (zh)
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_BASE_URL: ${{ secrets.KIMI_BASE_URL }}
          OPENROUTER_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_WAIT_MAX_SECONDS: "600"
          AI_WAIT_BASE_SECONDS: "10"
          AI_WAIT_MAX_SLEEP_SECONDS: "60"
          BACKFILL_SCOPE: ${{ inputs.scope }}
          AI_ZH_BATCH_SIZE: ${{ inputs.batch_size }}
          AI_ZH_MAX_PASSES: ${{ inputs.max_passes }}
          BACKFILL_FULL_MAX: ${{ inputs.full_max }}
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then
            python backfill_zh.py --full
          else
            python backfill_zh.py
          fi

      - name: Commit and push
        # 部分回填也要推送: 脚本在未填完时 exit 2, 但已完成的部分必须保留(幂等, 下次接着跑)
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if git diff --staged --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "🔁 Backfill zh fields"
          # race-safe push: rebase onto moved origin/main and retry (parallel workflows push to main)
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase -X ours origin/main || { git rebase --abort; exit 1; }
            if git push origin main; then echo "pushed on attempt $i"; exit 0; fi
            sleep 5
          done
          echo "push failed after 5 attempts"; exit 1

      - name: Verify completion (fail if still missing)
        env:
          FULL_MODE: ${{ inputs.full }}
        run: |
          python - <<'PY'
          import json, os
          full_mode = os.environ.get("FULL_MODE") == "true"
          with open("data/index.json","r",encoding="utf-8") as f:
            articles = (json.load(f) or {}).get("articles", []) or []
          missing = 0
          for a in articles:
            if full_mode:
                abstract = (a.get("abstract") or "").strip()
                full = (a.get("abstract_zh_full") or "").strip()
                if abstract and not full:
                    missing += 1
                continue
            if not (a.get("title_zh") or "").strip():
              missing += 1
              continue
            if not (a.get("abstract_zh") or "").strip():
              missing += 1
              continue
          print("missing", missing)
          # full 模式允许限量回填(BACKFILL_FULL_MAX),有剩余不算失败
          raise SystemExit(0 if (missing == 0 or full_mode) else 1)
          PY
