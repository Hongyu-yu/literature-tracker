name: Deploy GitHub Pages (on push)

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    # 避免与 fetch.yml 的 deploy job 重复（fetch.yml 由 github-actions[bot] 提交并自行部署）
    # ⚠️ 不要"补全"这份排除列表：generate-deep.yml 没有自己的 deploy job，它的
    # "📖 Deep read + posters + feed" 提交正是靠这里没被排除才得以发布。把它（或
    # backfill/update-focus-profile 的提交信息）加进来会静默中断对应内容的发布。
    if: github.actor != 'github-actions[bot]' && !startsWith(github.event.head_commit.message, '📚 自动更新文献') && !startsWith(github.event.head_commit.message, '🔬 自动生成周报')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare docs data
        run: |
          mkdir -p docs/data
          # 只复制站点真正会请求的文件。docs/*.js/*.html 全量 grep 只出现 data/index.json，
          # sw.js 里的 /data/ 只是运行时缓存规则、不是预缓存清单。
          # 此前 `cp -r data/*` 把整份 data/(123MB：ai_relevant 36M、history 21M、
          # deep_history 5.5M、zotero.bib 4.7M……)塞进 Pages artifact，拖慢每次部署，
          # 也在往 Pages 的 1GB 上限上顶。
          for f in index.json; do
            if [ -f "data/$f" ]; then
              cp "data/$f" "docs/data/$f"
            fi
          done

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "docs"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
