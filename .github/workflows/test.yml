name: 测试抓取(5个RSS)

on:
  workflow_dispatch:  # 手动触发

# 只读：此前这里是 contents: write 且会把 test_run.py 写出的测试数据 commit/push 到 main
# （test_run.py 直接写真实的 data/ 与 articles/），任何人 dispatch 一次就污染线上数据集。
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 安装依赖
        run: pip install -r requirements.txt
      
      # 纯手动冒烟：只验证 RSS 抓取/翻译链路是否通，产物留在 runner 里不入库。
      - name: 运行测试脚本
        run: python test_run.py
