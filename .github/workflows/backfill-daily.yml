name: Backfill Daily Pages (one-shot)

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Generate past N days ending at Beijing yesterday"
        required: false
        default: "60"
      force:
        description: "Force regenerate (ignore digest cache)"
        required: false
        default: "true"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "backfill-daily"
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Configure gateway hosts (fallback for gateway DNS resolution failure; mapping in secret)
        run: echo "${{ secrets.AI_HOSTS_ENTRY }}" | sudo tee -a /etc/hosts

      - name: Generate daily pages
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          OPENROUTER_BASE_URL: ${{ secrets.AI_BASE_URL }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_BASE_URL: ${{ secrets.KIMI_BASE_URL }}
          AI_RESPONSE_JSON: "1"
          # 同 fetch.yml：批量输出远超 OpenRouterProvider 的 4096 默认值
          AI_MAX_TOKENS: "16384"
          # 交叉方向旋钮（可用仓库 Variables 覆盖，无需改代码）
          # CROSS_MIN_SCORE  进「AI×科学交叉」区的分数线(0-10)，调高更严、调低更宽
          # AI_CROSS_DAILY_MAX 每次运行最多给多少篇打交叉分（0 = 关掉 AI 打分，退回规则分层）
          # DAILY_MAX_KEEP   单日日报保留篇数（交叉区 + 其他区）
          CROSS_MIN_SCORE: ${{ vars.CROSS_MIN_SCORE || '6' }}
          AI_CROSS_DAILY_MAX: ${{ vars.AI_CROSS_DAILY_MAX || '60' }}
          DAILY_MAX_KEEP: ${{ vars.DAILY_MAX_KEEP || '72' }}
          AI_DAILY_MAX_PER_CALL: "20"
          AI_DAILY_WAIT_MAX_SECONDS: "3600"
          AI_DAILY_WAIT_BASE_SECONDS: "20"
          AI_DAILY_WAIT_MAX_SLEEP_SECONDS: "300"
          AI_DAILY_NO_FALLBACK: "1"
          FORCE_MODE: ${{ inputs.force }}
          DAYS: ${{ inputs.days }}
        # dispatch 输入经 env 传入，避免把用户输入拼进 shell 命令
        run: |
          if [ "$FORCE_MODE" = "true" ]; then
            python generate_daily_pages.py --days "$DAYS" --force
          else
            python generate_daily_pages.py --days "$DAYS"
          fi

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if git diff --staged --quiet; then
            echo 'nothing to commit'
            exit 0
          fi
          git commit -m "📰 Backfill daily pages"
          # Race-safe push: rebase with -X theirs (backfill output IS the wanted content),
          # retry up to 5 times if push rejected by concurrent push.
          # NB: rebase 会把两边对调 —— "ours" 指被 replay 到的 origin/main，"theirs" 才是本次
          # 生成的内容。用 -X ours 会在冲突时静默丢弃本次跑出来的结果（见 test_actions.py 守卫）。
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase -X theirs origin/main || { echo "rebase still conflicted on attempt $i"; git rebase --abort; exit 1; }
            if git push origin main; then
              echo "push succeeded on attempt $i"
              exit 0
            fi
            echo "push rejected on attempt $i, retrying..."
            sleep 5
          done
          echo "❌ push still failing after 5 attempts"
          exit 1
